<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8"/>
    <title>Movian</title>
    <link rel="stylesheet" href="app.css"/>
    <script defer src="app.js"></script>
  </head>
  <body>

    <canvas id="canvas" tabindex="0"></canvas>

    <div id="loader">

      <img src="st128.png"/>
      <div>Movian-<span id="vertag">unknown</span> is starting, please wait...</div>
      <div>This can take up to one minute while the browser initializes the runtime.</div>
    </div>
    <div id="crash" style="display:none">
      <p>
        Oops! Movian crashed. Please report this at <a href="https://movian.tv/">Movians support site</a>. Please include the following info:
      <p>
        <span id="crashinfo">
        </span>
      </div>
  </body>
</html>
